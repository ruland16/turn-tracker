<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turn Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-secondary: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --success: #10b981;
    --success-bg: #d1fae5;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.06);
    --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.05), 0 2px 4px -2px rgba(15,23,42,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.06), 0 4px 6px -4px rgba(15,23,42,0.04);
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  .header .subtitle {
    color: var(--text-secondary);
    font-size: 0.875rem;
    margin-top: 2px;
  }

  /* Auth bar */
  .auth-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .auth-bar input {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9375rem;
    background: var(--bg);
    color: var(--text);
    transition: var(--transition);
  }

  .auth-bar input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }

  .auth-bar label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
  }

  .auth-bar label input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
    cursor: pointer;
    min-width: auto;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-success {
    background: var(--success);
    color: #fff;
  }

  .btn-success:hover {
    background: #059669;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-warning {
    background: var(--warning);
    color: #fff;
  }

  .btn-warning:hover {
    background: #d97706;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  .btn-danger:hover {
    background: var(--danger-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 0.8125rem;
  }

  /* Section */
  .section {
    margin-bottom: 40px;
  }

  .section-title {
    font-size: 1.125rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Task toggles */
  .task-list {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .task-toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
  }

  .task-toggle:hover {
    border-color: #cbd5e1;
    box-shadow: var(--shadow-md);
  }

  .task-toggle.disabled {
    background: #fef2f2;
    border-color: #fecaca;
  }

  .task-toggle.disabled:hover {
    border-color: #fca5a5;
  }

  /* Custom checkbox */
  .custom-check {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .task-toggle:not(.disabled) .custom-check {
    background: var(--primary);
    border-color: var(--primary);
  }

  .task-toggle:not(.disabled) .custom-check::after {
    content: '';
    width: 6px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    margin-top: -2px;
  }

  .task-toggle .label {
    font-weight: 600;
    font-size: 0.9375rem;
  }

  .task-toggle .label span {
    margin-left: 8px;
  }

  /* Date label */
  .date-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin-bottom: 16px;
    font-weight: 500;
  }

  /* Cards grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), #818cf8);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover::before {
    opacity: 1;
  }

  .card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .card h3 {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.025em;
  }

  .card .kid {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 4px 0 12px;
    letter-spacing: -0.025em;
  }

  .card .meta {
    font-size: 0.8125rem;
    color: var(--text-secondary);
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.025em;
  }

  .badge-pending {
    background: var(--warning-bg);
    color: #92400e;
  }

  .badge-pending::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--warning);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .badge-done {
    background: var(--success-bg);
    color: #065f46;
  }

  .badge-done::before {
    content: '\2713';
    font-size: 0.7rem;
  }

  .badge-disabled {
    background: #fee2e2;
    color: #991b1b;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Skip panel */
  .skip-panel {
    margin-top: 16px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .skip-panel label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .skip-panel select {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 0.9375rem;
    background: var(--surface);
    color: var(--text);
    margin-right: 8px;
    cursor: pointer;
  }

  .skip-panel select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }

  .skip-note {
    font-size: 0.8125rem;
    color: var(--text-secondary);
    margin-top: 12px;
    padding: 10px 12px;
    background: #fffbeb;
    border-radius: 8px;
    border-left: 3px solid var(--warning);
  }

  /* Tomorrow strip */
  .tomorrow-strip {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .tomorrow-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: var(--transition);
  }

  .tomorrow-item:hover {
    box-shadow: var(--shadow-md);
  }

  .tomorrow-item .t-task {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.025em;
  }

  .tomorrow-item .t-sep {
    color: var(--border);
    font-size: 1rem;
  }

  .tomorrow-item .t-name {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  /* History table */
  .history-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }

  .history-table th {
    background: var(--bg);
    padding: 14px 18px;
    text-align: left;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  .history-table td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .history-table tr:last-child td {
    border-bottom: none;
  }

  .history-table tr:hover td {
    background: var(--surface-hover);
  }

  .history-table td:last-child {
    color: var(--text-secondary);
    font-size: 0.8125rem;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-secondary);
  }

  .empty-state svg {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  /* Utilities */
  .hidden { display: none !important; }

  /* Responsive */
  @media (max-width: 640px) {
    .container { padding: 20px 16px; }
    .header h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: 1fr; }
    .auth-bar { flex-direction: column; align-items: stretch; }
    .auth-bar .btn { width: 100%; justify-content: center; }
    .task-list { flex-direction: column; }
    .task-toggle { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Turn Tracker</h1>
      <div class="subtitle">Family chore rotation dashboard</div>
    </div>
  </div>

  <div class="auth-bar">
    <input type="password" id="token" placeholder="Enter dashboard auth token" />
    <label>
      <input type="checkbox" id="rememberToken" checked />
      Remember this device
    </label>
    <button class="btn btn-primary" onclick="loadToday()">Load Today</button>
    <button class="btn btn-success" onclick="sendNow()">Send Now</button>
    <button class="btn btn-ghost" onclick="clearSavedToken()">Forget</button>
  </div>

  <div id="dashboard" class="hidden">
    <div class="section">
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Tasks
      </div>
      <div class="task-list" id="taskList"></div>
    </div>

    <div class="section">
      <div class="date-label" id="todayDate"></div>
      <div class="grid" id="todayGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Tomorrow
      </div>
      <div class="date-label" id="tomorrowDate"></div>
      <div class="tomorrow-strip" id="tomorrowStrip"></div>
    </div>

    <div class="section">
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Last 7 Days
      </div>
      <div class="history-wrap">
        <table class="history-table">
          <thead>
            <tr><th>Date</th><th>Task</th><th>Kid</th><th>Status</th><th>Done At</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const tokenInput = document.getElementById('token');
const rememberCheckbox = document.getElementById('rememberToken');

// Auto-fill saved token on page load
const savedToken = localStorage.getItem('turnTrackerToken');
if (savedToken) {
  tokenInput.value = savedToken;
}

function getToken() {
  return tokenInput.value.trim();
}

function saveToken(token) {
  if (rememberCheckbox.checked) {
    localStorage.setItem('turnTrackerToken', token);
  }
}

function clearSavedToken() {
  localStorage.removeItem('turnTrackerToken');
  tokenInput.value = '';
  showToast('Saved token cleared');
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:12px 20px;border-radius:12px;font-size:0.875rem;font-weight:500;box-shadow:var(--shadow-lg);z-index:9999;animation:slideUp 0.3s ease;';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function loadToday() {
  const token = getToken();
  if (!token) { alert('Please enter the auth token'); return; }

  try {
    const [todayRes, histRes, tasksRes, kidsRes, tomorrowRes] = await Promise.all([
      fetch('/api/today?token=' + encodeURIComponent(token)),
      fetch('/api/history?days=7&token=' + encodeURIComponent(token)),
      fetch('/api/tasks?token=' + encodeURIComponent(token)),
      fetch('/api/kids?token=' + encodeURIComponent(token)),
      fetch('/api/tomorrow?token=' + encodeURIComponent(token))
    ]);

    const today = await todayRes.json();
    const history = await histRes.json();
    const tasks = await tasksRes.json();
    const kids = await kidsRes.json();
    const tomorrow = await tomorrowRes.json();
    const kidMap = Object.fromEntries(kids.map(k => [k.id, k.name]));

    if (today.error) { alert(today.error); return; }

    saveToken(token);
    renderTasks(tasks);

    window._todayDateStr = today.date;
    function refreshTodayLabel() {
      const datePart = new Date(window._todayDateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timePart = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('todayDate').textContent = 'Today — ' + datePart + ' · ' + timePart;
    }
    refreshTodayLabel();
    if (!window._todayClockInterval) {
      window._todayClockInterval = setInterval(refreshTodayLabel, 30000);
    }
    const grid = document.getElementById('todayGrid');
    grid.innerHTML = '';

    if (today.assignments.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
          <div style="font-weight:600;margin-bottom:4px;">No assignments today</div>
          <div style="font-size:0.875rem;">All tasks are either disabled or already completed.</div>
        </div>`;
    }

    for (const a of today.assignments) {
      const div = document.createElement('div');
      div.className = 'card';
      const statusClass = a.status === 'done' ? 'badge-done' : 'badge-pending';
      const doneBtn = a.status === 'pending'
        ? `<button class="btn btn-success btn-sm" onclick="markDone(${a.id})">Mark Done</button>`
        : '';
      const skipBtn = a.status === 'pending'
        ? `<button class="btn btn-warning btn-sm" onclick="showSkipPanel(${a.id}, ${a.task_id}, '${a.kid_name}', ${JSON.stringify(kidMap).replace(/"/g, '&quot;')})">Skip / Reassign</button>`
        : '';
      div.innerHTML = `
        <div class="card-header">
          <h3>${a.display_name}</h3>
          <span class="badge ${statusClass}">${a.status}</span>
        </div>
        <div class="kid">${a.kid_name}</div>
        <div class="meta">${a.platform === 'email' ? a.email : (a.platform === 'telegram' ? 'Telegram' : 'Google Chat')}</div>
        <div class="card-actions">
          ${doneBtn}
          ${skipBtn}
        </div>
        <div id="skip-panel-${a.id}" class="skip-panel hidden"></div>
      `;
      grid.appendChild(div);
    }

    document.getElementById('tomorrowDate').textContent = new Date(tomorrow.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const strip = document.getElementById('tomorrowStrip');
    strip.innerHTML = tomorrow.assignments.length === 0
      ? '<div style="color:var(--text-secondary);font-size:0.875rem;">No tasks enabled for tomorrow.</div>'
      : tomorrow.assignments.map(a => `
          <div class="tomorrow-item">
            <span class="t-task">${a.display_name}</span>
            <span class="t-sep">→</span>
            <span class="t-name">${a.kid_name || '—'}</span>
          </div>`).join('');

    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = history.map(h => {
      const statusClass = h.status === 'done' ? 'badge-done' : 'badge-pending';
      const doneAt = h.completed_at ? new Date(h.completed_at).toLocaleString() : '-';
      return `<tr>
        <td>${h.date}</td>
        <td>${h.display_name}</td>
        <td>${h.kid_name}</td>
        <td><span class="badge ${statusClass}">${h.status}</span></td>
        <td>${doneAt}</td>
      </tr>`;
    }).join('');

    document.getElementById('dashboard').classList.remove('hidden');
  } catch (e) {
    alert('Failed to load data: ' + e.message);
  }
}

function renderTasks(tasks) {
  const container = document.getElementById('taskList');
  container.innerHTML = tasks.map(t => {
    const disabled = t.enabled === 0;
    return `<div class="task-toggle ${disabled ? 'disabled' : ''}" onclick="toggleTask(${t.id}, this)">
      <div class="custom-check"></div>
      <div class="label">${t.display_name}${disabled ? ' <span class="badge badge-disabled">OFF</span>' : ''}</div>
    </div>`;
  }).join('');
}

async function toggleTask(taskId, el) {
  const token = getToken();
  const res = await fetch(`/api/tasks/${taskId}/toggle?token=${encodeURIComponent(token)}`, { method: 'POST' });
  const data = await res.json();
  if (data.success) {
    el.classList.toggle('disabled', data.enabled === 0);
    const check = el.querySelector('.custom-check');
    if (data.enabled === 1) {
      check.style.background = 'var(--primary)';
      check.style.borderColor = 'var(--primary)';
      check.innerHTML = '<div style="width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px;"></div>';
    } else {
      check.style.background = 'transparent';
      check.style.borderColor = 'var(--border)';
      check.innerHTML = '';
    }
    const badge = el.querySelector('.badge-disabled');
    if (data.enabled === 0 && !badge) {
      el.querySelector('.label').innerHTML += ' <span class="badge badge-disabled">OFF</span>';
    } else if (data.enabled === 1 && badge) {
      badge.remove();
    }
    loadToday();
  }
}

async function markDone(id) {
  const token = getToken();
  await fetch(`/api/assignments/${id}/done?token=` + encodeURIComponent(token), { method: 'POST' });
  loadToday();
}

function showSkipPanel(assignmentId, taskId, currentKidName, kidMap) {
  const panel = document.getElementById(`skip-panel-${assignmentId}`);
  if (!panel.classList.contains('hidden')) {
    panel.classList.add('hidden');
    return;
  }

  fetch(`/api/tasks?token=${encodeURIComponent(getToken())}`)
    .then(r => r.json())
    .then(tasks => {
      const task = tasks.find(t => t.id === taskId);
      const kidIds = JSON.parse(task.kid_ids);
      const isTwoKid = kidIds.length === 2;

      panel.innerHTML = `
        <label>Reassign to</label>
        <select id="reassign-kid-${assignmentId}">
          ${kidIds.map(id => `<option value="${id}">${kidMap[id] || 'Kid ' + id}</option>`).join('')}
        </select>
        <button class="btn btn-primary btn-sm" style="margin-right:4px;" onclick="reassign(${assignmentId}, ${taskId})">Confirm</button>
        <button class="btn btn-danger btn-sm" onclick="skip(${assignmentId})">Skip Only</button>
        <div class="skip-note">${currentKidName} simply skips this turn. Rotation continues normally.</div>
      `;
      panel.classList.remove('hidden');
    });
}

async function reassign(assignmentId, taskId) {
  const token = getToken();
  const kidId = document.getElementById(`reassign-kid-${assignmentId}`).value;
  await fetch(`/api/assignments/${assignmentId}/reassign?token=${encodeURIComponent(token)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kid_id: parseInt(kidId, 10) })
  });
  loadToday();
}

async function skip(assignmentId) {
  const token = getToken();
  const res = await fetch(`/api/assignments/${assignmentId}/skip?token=${encodeURIComponent(token)}`, { method: 'POST' });
  const data = await res.json();
  if (data.success) {
    showToast(`Reassigned to ${data.newKid.name}${data.makeup ? ' — makeup recorded' : ''}`);
  } else {
    alert(data.error || 'Failed');
  }
  loadToday();
}

async function sendNow() {
  const token = getToken();
  if (!token) { alert('Please enter the auth token'); return; }
  const res = await fetch('/api/send-now?token=' + encodeURIComponent(token), { method: 'POST' });
  const data = await res.json();
  showToast('Sent ' + data.sent + ' notifications');
}
</script>
